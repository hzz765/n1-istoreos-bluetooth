name: N1 normal Bluetooth firmware candidate
run-name: N1 firmware candidate / run ${{ github.run_number }}
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/candidate.yml
      - firmware/**
permissions:
  contents: read
concurrency:
  group: n1-candidate
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    env:
      BUILD_MODE: candidate
      CCACHE_MAXSIZE: 3GiB
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Record space and remove unused hosted tools
        run: |
          df -h
          df -i
          # Only disposable GitHub-hosted runner tool directories.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h
          df -i
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev file wget curl patch xz-utils device-tree-compiler u-boot-tools squashfs-tools dosfstools mtools libelf-dev python3-pyelftools kmod util-linux bsdextrautils e2fsprogs qemu-user-static libgnutls28-dev python3-dev bc
      - name: Test candidate configuration and malformed image rejection
        run: |
          python3 firmware/test_candidate.py
          python3 firmware/test_checkpoint.py
      - name: Prepare pinned source and configuration
        run: setsid bash scripts/build.sh "$BUILD_MODE" prepare
      # Only compiler outputs from public source; never cache the workspace or home.
      - name: Restore compiler cache
        id: compiler_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: source/.ccache
          key: n1-ccache-v1-${{ runner.os }}-${{ runner.arch }}-ubuntu22-${{ hashFiles('configs/*', 'patches/*', 'scripts/build.sh', 'firmware/*.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            n1-ccache-v1-${{ runner.os }}-${{ runner.arch }}-ubuntu22-${{ hashFiles('configs/*', 'patches/*', 'scripts/build.sh', 'firmware/*.py') }}-
            n1-ccache-v1-${{ runner.os }}-${{ runner.arch }}-ubuntu22-
      - name: Restore public source archive cache
        id: source_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: download-cache
          restore-keys: n1-sources-v1-
          key: n1-sources-v1-${{ hashFiles('configs/*', 'scripts/build.sh', 'scripts/download_cache.py') }}
      - name: Validate restored source archives
        run: python3 scripts/download_cache.py restore
      - name: Download verified sources
        run: setsid bash scripts/build.sh "$BUILD_MODE" download
      - name: Prepare bounded source archive cache
        if: steps.source_cache.outputs.cache-hit != 'true'
        run: python3 scripts/download_cache.py save
      - name: Save public source archives
        if: steps.source_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: download-cache
          key: ${{ steps.source_cache.outputs.cache-primary-key }}
      - name: Compile host tools including LLVM
        run: setsid bash scripts/build.sh "$BUILD_MODE" tools
      - name: Report compiler cache statistics
        run: source/staging_dir/host/bin/ccache --show-stats
        env:
          CCACHE_DIR: ${{ github.workspace }}/source/.ccache
      # Save immediately after expensive host tools succeed, even if later firmware fails.
      - name: Save compiler cache for later builds
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: source/.ccache
          key: ${{ steps.compiler_cache.outputs.cache-primary-key }}
      - name: Compile target toolchain
        run: setsid bash scripts/build.sh "$BUILD_MODE" toolchain
      - name: Compile Linux kernel
        run: setsid bash scripts/build.sh "$BUILD_MODE" kernel
      - name: Build normal firmware and matching packages
        run: setsid bash scripts/build.sh "$BUILD_MODE" firmware
      - name: Retain public compile checkpoint for inspection only
        run: |
          python3 scripts/check_public.py
          python3 firmware/checkpoint.py
      - name: Upload unverified compile checkpoint - never install
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: UNVERIFIED-N1-COMPILE-CHECKPOINT-${{ github.run_id }}
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
          path: |
            candidate-checkpoint/UNVERIFIED-compile-checkpoint.tar
            candidate-checkpoint/SHA256SUMS
            candidate-checkpoint/DO-NOT-INSTALL.txt
      - name: Inspect candidate image without booting it
        run: setsid bash scripts/build.sh "$BUILD_MODE" verify
      - name: Save final compiler cache
        if: always() && steps.compiler_cache.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: source/.ccache
          key: ${{ steps.compiler_cache.outputs.cache-primary-key }}-final
      - name: Check public artifact text for credentials
        if: always()
        id: public_scan
        run: python3 scripts/check_public.py
      - name: Upload public build records
        if: ${{ always() && steps.public_scan.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: n1-candidate-records-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            public-artifacts/build.log
            public-artifacts/build.config
            public-artifacts/kernel.config
            public-artifacts/source-commit.txt
            public-artifacts/feeds.lock
            public-artifacts/verification.txt
            public-artifacts/candidate-scope.txt
            public-artifacts/candidate-verification.json
            public-artifacts/package-manifest.json
            public-artifacts/SHA256SUMS
      - name: Upload checked candidate and same-build packages
        if: ${{ success() && steps.public_scan.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: n1-firmware-CANDIDATE-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: |
            public-artifacts/n1-istoreos-24.10.8-bluetooth-CANDIDATE.img.gz
            public-artifacts/packages/*.ipk
            public-artifacts/build.config
            public-artifacts/kernel.config
            public-artifacts/source-commit.txt
            public-artifacts/feeds.lock
            public-artifacts/candidate-scope.txt
            public-artifacts/candidate-verification.json
            public-artifacts/package-manifest.json
            public-artifacts/SHA256SUMS
