name: N1 RFCOMM control tool
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: n1-rfcomm
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev file wget curl patch xz-utils libelf-dev python3-pyelftools libgnutls28-dev python3-dev bc
          df -h .
      - name: Pin source and userspace configuration
        run: setsid bash audio/build.sh prepare
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: source/.ccache
          key: n1-audio-ccache-${{ github.run_id }}
          restore-keys: |
            n1-audio-ccache-
            n1-ccache-v1-Linux-X64-ubuntu22-
      - name: Host tools without LLVM
        run: setsid bash audio/build.sh tools
      - name: Matching target compiler and libc
        run: setsid bash audio/build.sh toolchain
      - name: Audio userspace packages only
        run: setsid bash audio/build.sh packages
      - name: Collect public userspace packages
        run: setsid bash audio/build.sh collect
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always()
        with:
          path: source/.ccache
          key: n1-audio-ccache-${{ github.run_id }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 42550922394
          name: n1-hcd-control-42550922394
          path: audio-base
      - name: Audit against original USB libraries
        run: |
          sudo apt-get install -y squashfs-tools qemu-user-static
          mv audio-output audio-input
          (cd audio-input && sha256sum -c SHA256SUMS)
          sudo python3 audio/validate.py
          mkdir rfcomm-output
          cp audio-audit/root/usr/bin/bluealsa-rfcomm rfcomm-output/
          cp audio/BlueALSA-LICENSE rfcomm-output/LICENSE
          cp audio-validated/manifest.json rfcomm-output/audit.json
          (cd rfcomm-output && sha256sum bluealsa-rfcomm LICENSE audit.json > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: n1-rfcomm-${{ github.run_id }}
          path: |
            rfcomm-output/bluealsa-rfcomm
            rfcomm-output/LICENSE
            rfcomm-output/audit.json
            rfcomm-output/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
