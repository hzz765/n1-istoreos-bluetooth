name: N1 isolated USB build
run-name: N1 / ${{ inputs.mode }} / run ${{ github.run_number }}
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build stage
        required: true
        default: probe
        type: choice
        options: [probe, baseline, usb-test]
permissions:
  contents: read
concurrency:
  group: n1-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    env:
      BUILD_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Record space and remove unused hosted tools
        run: |
          df -h
          df -i
          # Only disposable GitHub-hosted runner tool directories.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h
          df -i
      - name: Install build dependencies
        if: inputs.mode != 'probe'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev file wget curl patch xz-utils device-tree-compiler u-boot-tools squashfs-tools dosfstools mtools libelf-dev python3-pyelftools kmod
      - name: Probe resources
        if: inputs.mode == 'probe'
        run: bash scripts/build.sh probe
      - name: Prepare pinned source and configuration
        if: inputs.mode != 'probe'
        run: setsid bash scripts/build.sh "$BUILD_MODE" prepare
      - name: Download verified sources
        if: inputs.mode != 'probe'
        run: setsid bash scripts/build.sh "$BUILD_MODE" download
      - name: Compile host tools including LLVM
        if: inputs.mode != 'probe'
        run: setsid bash scripts/build.sh "$BUILD_MODE" tools
      - name: Compile target toolchain
        if: inputs.mode != 'probe'
        run: setsid bash scripts/build.sh "$BUILD_MODE" toolchain
      - name: Compile Linux kernel
        if: inputs.mode != 'probe'
        run: setsid bash scripts/build.sh "$BUILD_MODE" kernel
      - name: Build USB firmware and packages
        if: inputs.mode == 'usb-test'
        run: setsid bash scripts/build.sh "$BUILD_MODE" firmware
      - name: Verify baseline or USB image
        if: inputs.mode != 'probe'
        run: setsid bash scripts/build.sh "$BUILD_MODE" verify
      - name: Check public artifact text for credentials
        if: always()
        id: public_scan
        run: python3 scripts/check_public.py
      - name: Upload explicitly selected build outputs
        if: ${{ always() && steps.public_scan.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: n1-${{ inputs.mode }}-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            public-artifacts/build.log
            public-artifacts/build.config
            public-artifacts/kernel.config
            public-artifacts/source-commit.txt
            public-artifacts/feeds.lock
            public-artifacts/verification.txt
            public-artifacts/SHA256SUMS
            public-artifacts/n1-usb-test.img.gz
