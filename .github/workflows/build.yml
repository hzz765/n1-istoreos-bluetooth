name: N1 isolated USB build
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build stage
        required: true
        default: probe
        type: choice
        options: [probe, baseline, usb-test]
permissions:
  contents: read
concurrency:
  group: n1-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Record space and remove unused hosted tools
        run: |
          df -h
          df -i
          # Only disposable GitHub-hosted runner tool directories.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h
          df -i
      - name: Install build dependencies
        if: inputs.mode != 'probe'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev file wget curl patch xz-utils device-tree-compiler u-boot-tools squashfs-tools dosfstools mtools libelf-dev python3-pyelftools
      - name: Build with disk reserve monitoring
        env:
          BUILD_MODE: ${{ inputs.mode }}
        run: setsid bash scripts/build.sh "$BUILD_MODE"
      - name: Upload explicitly selected build outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: n1-${{ inputs.mode }}-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            public-artifacts/build.log
            public-artifacts/build.config
            public-artifacts/kernel.config
            public-artifacts/source-commit.txt
            public-artifacts/feeds.lock
            public-artifacts/verification.txt
            public-artifacts/SHA256SUMS
            public-artifacts/n1-usb-test.img.gz
